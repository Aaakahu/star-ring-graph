        nodes.push(n);

      walk(root, null);
      return nodes.filter(n => n.type !== 'root' && n.type !== 'chapter');

    function getHits(q) {
      if (MOCK_HITS[q]) return MOCK_HITS[q];
      for (const key of Object.keys(MOCK_HITS)) {

      return ALL_NODES.filter(n => n.name.includes(q) || q.includes(n.name.slice(0,2))).map(n => n.name);

      const hits = getHits(q);

      const hitMap = new Map();

        const n = ALL_NODES.find(x => x.name === name);

          if (!hitMap.has(n.id) || i < hitMap.get(n.id)) hitMap.set(n.id, i);

      });

      // 类型过滤
      const final = [];
      hitMap.forEach((rank, id) => {
        const n = ALL_NODES.find(x => x.id === id);

        if (t === 'moc' && action.moc) final.push({ ...n, rank });

      });

      render(final);

      const create = (tag, attrs) => {

      });

      // 坐标轴
      svg.appendChild(create('line', { x1: left, y1: bottom, x2: right, y2: bottom, stroke: '#4b5563', 'stroke-width': 1.5 }));
      svg.appendChild(create('line', { x1: left, y1: top, x2: left, y2: bottom, stroke: '#4b5563', 'stroke-width': 1.5 }));

        const empty = create('text', { x: W / 2, y: H / 2, 'text-anchor': 'middle', fill: '#64748b', 'font-size': 14 });
        empty.textContent = '无命中节点（换个查询词或模式试试）';
        svg.appendChild(empty);
        return;
      }

      // 布局：按 type 分组，组内按 rank 排，x 映射到 [left, right]
      const byType = { moc: [], Flash: [], Error: [] };
      nodes.forEach(n => { (byType[n.type] || []).push(n); });
      Object.values(byType).forEach(arr => arr.sort((a, b) => a.rank - b.rank));

      const positions = new Map();
      Object.entries(byType).forEach(([type, arr]) => {
        arr.forEach((n, i) => {
          // rank 越小越靠右；同 rank 垂直错开避免重叠
          const t = (arr.length <= 1) ? 0 : i / (arr.length - 1);
          const x = right - (right - left) * (n.rank / Math.max(1, Math.max(...nodes.map(x => x.rank))));
          const y = Y_BAND[type] + (i % 2 === 0 ? -1 : 1) * (Math.min(40, 120 / Math.max(arr.length, 2))) * (Math.floor(i / 2) + 1) * 0.6;
          positions.set(n.id, { x, y });
        });
      });

      // 画父子连线（父→子，仅当两端都在 final 中）
      nodes.forEach(n => {
        if (n.parent == null) return;
        const p = positions.get(n.parent);
        const c = positions.get(n.id);
        if (!p || !c) return;
        svg.appendChild(create('line', {
          x1: p.x, y1: p.y, x2: c.x, y2: c.y,
          stroke: 'rgba(255,255,255,0.15)', 'stroke-width': 1, 'stroke-dasharray': '3 3'
        }));
      });

      // 画节点
      const maxRank = Math.max(...nodes.map(n => n.rank), 1);
      nodes.forEach(n => {
        const pos = positions.get(n.id);
        const scale = 2.4 - (n.rank / maxRank) * 1.6; // rank0=2.4x, rankmax=0.8x
        const baseSize = n.type === 'moc' ? 16 : (n.type === 'Flash' ? 12 : 10);
        const r = baseSize * scale / 2;
        const color = COLORS[n.type];
        const isTop = n.rank === 0;

        const g = create('g', { class: 'node-group' });

        // 发光圈
        if (n.rank <= 1) {
          g.appendChild(create('circle', {
            cx: pos.x, cy: pos.y, r: r + 8,
            fill: color, opacity: 0.12,
            class: 'pulse'
          }));
        }

        // 节点圆
        g.appendChild(create('circle', {
          cx: pos.x, cy: pos.y, r: r,
          fill: color,
          stroke: isTop ? '#fbbf24' : 'rgba(255,255,255,0.6)',
          'stroke-width': isTop ? 3 : 1.5,
          class: 'node-circle'
        }));

        // 标签
        const label = create('text', {
          x: pos.x, y: pos.y + r + 14,
          'text-anchor': 'middle', class: 'node-label',
          opacity: n.rank <= 2 ? 1 : 0.55
        });
        label.textContent = n.name;
        g.appendChild(label);

        // 交互
        g.addEventListener('mouseenter', (e) => showTooltip(e, n, n.rank));
        g.addEventListener('mouseleave', hideTooltip);

        svg.appendChild(g);
      });

      // 排名标记
      const best = nodes.reduce((a, b) => a.rank < b.rank ? a : b);
      const bestPos = positions.get(best.id);
      svg.appendChild(create('text', {
        x: bestPos.x, y: bestPos.y - best.type === 'moc' ? 28 : 22,
        'text-anchor': 'middle', fill: '#fbbf24', 'font-size': 11, 'font-weight': 600
      })).textContent = '最匹配';
    }

    const tooltip = document.getElementById('tooltip');
    function showTooltip(e, n, rank) {
      const rect = document.getElementById('chart').getBoundingClientRect();
      tooltip.innerHTML = `
        <div class="title">${n.name}</div>
        <div class="meta">
          类型：${n.type}${n.subtype ? ' · ' + n.subtype : ''}<br>
          匹配 rank：${rank}（越小越相关）<br>
          ${n.parent ? '父节点：' + ALL_NODES.find(x => x.id === n.parent)?.name : '顶层 MOC'}
        </div>
      `;
      tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
      tooltip.style.top = (e.clientY - rect.top + 12) + 'px';
      tooltip.style.opacity = 1;
    }
    function hideTooltip() {
      tooltip.style.opacity = 0;
    }

    // 回车触发
    document.getElementById('queryInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') runQuery();
    });

    // 初始查询
    runQuery();
  </script>
</body>
</html>
